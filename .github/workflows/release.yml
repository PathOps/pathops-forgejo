name: release

on:
  push:
    tags: ["v*-pathops.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/pathops/pathops-forgejo

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate tag against UPSTREAM_VERSION
        run: scripts/metadata.sh check-tag "$GITHUB_REF_NAME"

      - name: Prepare pinned upstream Forgejo and apply patches
        run: scripts/prepare-source.sh

      - name: Set up Go (version from upstream go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .work/forgejo/go.mod
          cache-dependency-path: .work/forgejo/go.sum

      - name: Test
        run: scripts/test.sh
        env:
          SKIP_PREPARE: "1"

  # The only job that can write packages. The image is built once, here.
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate tag against UPSTREAM_VERSION
        run: scripts/metadata.sh check-tag "$GITHUB_REF_NAME"

      - name: Prepare pinned upstream Forgejo and apply patches
        run: scripts/prepare-source.sh

      - name: Image labels
        id: meta
        run: |
          {
            echo "labels<<EOF"
            scripts/metadata.sh labels "$GITHUB_REF_NAME"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .work/forgejo
          file: .work/forgejo/Dockerfile.rootless
          platforms: linux/amd64
          build-args: RELEASE_VERSION=${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          push: true
          provenance: mode=max
          sbom: true

      - name: Record digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "Published ${IMAGE}:${GITHUB_REF_NAME}"
          echo "Digest ${DIGEST}"
          {
            echo "### Published image"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| tag | \`${IMAGE}:${GITHUB_REF_NAME}\` |"
            echo "| digest | \`${DIGEST}\` |"
            echo "| pin | \`${IMAGE}@${DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # No write permission: checks the published image and scans it.
  check:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GitHub Container Registry (read)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the Forgejo binary in the image
        env:
          REF: ${{ env.IMAGE }}@${{ needs.publish.outputs.digest }}
        run: |
          docker run --rm --entrypoint /app/gitea/gitea "$REF" --version | tee /dev/stderr | grep -q "16.0.5"
          docker run --rm --entrypoint /app/gitea/gitea "$REF" admin user create-authorized-integration --help \
            | grep -q -- "--reuse-existing"

      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ needs.publish.outputs.digest }}
          format: table
          output: trivy.txt
          exit-code: "0"

      - name: Scan summary
        if: always()
        run: |
          cat trivy.txt || true
          {
            echo "### Trivy scan (informational)"
            echo
            echo '```'
            cat trivy.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
